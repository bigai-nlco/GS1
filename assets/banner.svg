<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390" role="img" aria-labelledby="title desc">
  <title id="title">GS1 — Fast, Faithful, Frontier</title>
  <desc id="desc">General System One. Open decision models with native probabilities, runtime-defined candidates and zero generated tokens. Choice, Noul and Score are direct model outputs.</desc>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#C00000" opacity=".075"/></pattern>
    <linearGradient id="wash" x1="0" x2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF6F6"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#C00000" stroke-width="1.7"/></marker>
  </defs>
  <rect x=".5" y=".5" width="1439" height="389" rx="20" fill="url(#wash)" stroke="#EADADA"/>
  <path d="M20 0H1420Q1440 0 1440 20V6H0V20Q0 0 20 0Z" fill="#C00000"/>
  <rect x="950" y="7" width="480" height="375" fill="url(#grid)"/>
  <g font-family="Inter,Arial,Helvetica,sans-serif">
    <text x="55" y="136" font-size="112" font-weight="800" letter-spacing="-7" fill="#C00000">GS1</text>
    <path d="M294 60V136" stroke="#E8C9C9"/>
    <text x="320" y="89" font-size="19" font-weight="700" letter-spacing="3" fill="#29272B">GENERAL SYSTEM ONE</text>
    <text x="320" y="123" font-size="19" fill="#68616A">Open intelligence for decisions.</text>
    <text x="58" y="223" font-size="53" font-weight="750" letter-spacing="-1.7" fill="#252227">Fast, Faithful, <tspan fill="#C00000">Frontier.</tspan></text>
    <text x="60" y="266" font-size="20" fill="#625A62">Native probabilities. Dynamic choices. Zero generated tokens.</text>
    <g font-size="12" font-weight="700" letter-spacing="1.3">
      <rect x="59" y="307" width="141" height="31" rx="6" fill="#C00000"/>
      <text x="76" y="327" fill="#FFFFFF">OPEN WEIGHTS</text>
      <rect x="211" y="307" width="198" height="31" rx="6" fill="#FFF1F1" stroke="#EDD2D2"/>
      <text x="228" y="327" fill="#9B0000">NATIVE DECISIONS</text>
      <rect x="420" y="307" width="180" height="31" rx="6" fill="#FFF1F1" stroke="#EDD2D2"/>
      <text x="438" y="327" fill="#9B0000">CUDA GRAPH READY</text>
    </g>
    <rect x="981" y="43" width="385" height="49" rx="11" fill="#FFFFFF" stroke="#DEC4C4"/>
    <text x="1173" y="73" text-anchor="middle" font-size="16" font-weight="600" fill="#61555E">State + questions + candidates</text>
    <path d="M1173 95V116" stroke="#C00000" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="981" y="122" width="385" height="54" rx="11" fill="#C00000"/>
    <text x="1173" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Native evidence-retrieval head</text>
    <path d="M1173 179V199M1041 212V198H1305V212M1173 199V212" stroke="#C00000" stroke-width="1.5" fill="none"/>
    <g fill="#FFFFFF" stroke="#E9D4D4">
      <rect x="981" y="217" width="120" height="110" rx="12"/>
      <rect x="1113" y="217" width="120" height="110" rx="12"/>
      <rect x="1245" y="217" width="120" height="110" rx="12"/>
    </g>
    <g fill="#32272F" font-size="15" font-weight="700" text-anchor="middle">
      <text x="1041" y="245">Choice</text><text x="1173" y="245">Noul</text><text x="1305" y="245">Score</text>
    </g>
    <g fill="#F1D9D9"><rect x="998" y="260" width="86" height="7" rx="3"/><rect x="998" y="276" width="86" height="7" rx="3"/><rect x="998" y="292" width="86" height="7" rx="3"/></g>
    <g fill="#C00000"><rect x="998" y="260" width="70" height="7" rx="3"/><rect x="998" y="276" width="21" height="7" rx="3" opacity=".6"/><rect x="998" y="292" width="11" height="7" rx="3" opacity=".4"/></g>
    <path d="M1131 283H1215" stroke="#EFD9D9" stroke-width="7" stroke-linecap="round"/>
    <path d="M1131 283H1191" stroke="#C00000" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1191" cy="283" r="6" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
    <g fill="#EBC7C7"><rect x="1261" y="286" width="12" height="16" rx="2"/><rect x="1279" y="276" width="12" height="26" rx="2"/><rect x="1297" y="259" width="12" height="43" rx="2" fill="#C00000"/><rect x="1315" y="273" width="12" height="29" rx="2"/><rect x="1333" y="289" width="12" height="13" rx="2"/></g>
    <text x="1173" y="354" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.6" fill="#986F76">ONE DISTRIBUTION. READY FOR SOFTWARE.</text>
  </g>
</svg>
