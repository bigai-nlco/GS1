name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[serve,dev]'
      - run: ruff check gs1 benchmark tests scripts examples
      - run: ruff format --check gs1 benchmark tests scripts examples
      - run: python -m pytest -q
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
        working-directory: playground
      - run: npm run test:server && npm run build
        working-directory: playground
      - run: npx playwright install --with-deps chromium
        working-directory: playground
      - run: npm run test:e2e
        working-directory: playground
